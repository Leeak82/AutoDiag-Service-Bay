<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a1d"><title>AutoDiag · Service Bay</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/" aria-label="AutoDiag home"><span class="brand-mark">A<span>╱</span></span><strong>AUTO<span>DIAG</span></strong><small>VIRTUAL WORKSHOP</small></a><div class="bay-id"><i></i> BAY 01 <span> / </span> F-150 · 3.5L</div><button id="orderButton" class="quiet">Work order <span>↗</span></button></header>
<main><nav class="views" aria-label="Vehicle views"><button data-view="bay" class="active">Engine bay</button><button data-view="interior">Cabin / OBD</button><button data-view="under">Lower engine</button><button data-view="fuses">Fuse box</button><button data-view="wiring">Wiring</button><button id="notesButton" class="notes">Field notes <span id="noteCount">0</span></button></nav>
<section class="workspace"><div class="scene-heading"><div><span class="eyebrow" id="location">SERVICE BAY / FRONT</span><h1 id="sceneTitle">A no-start. Your diagnosis.</h1></div><span id="engineState" class="state">KEY OFF</span></div>
<div class="scene-controls"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="homeView" aria-label="Reset camera">⌖</button><button id="labelButton" class="active" aria-label="Toggle component labels">Aa</button></div>
<div id="sceneWrap"><svg id="scene" viewBox="0 0 1000 650" role="group" aria-label="Interactive vehicle service bay"></svg><svg id="leads" aria-hidden="true"></svg></div>
<div class="scene-foot"><span id="selection">Open the hood latch to begin.</span><span class="scene-legend"><i></i> Interactive test point</span></div>
<aside id="instrument" hidden></aside>
</section>
<section class="control-bar"><div class="ignition"><span class="eyebrow">IGNITION</span><button id="keyOff" class="active">OFF</button><button id="keyOn">ON</button><button id="crank" title="Hold to crank; release to stop starter">↻ <b>CRANK</b></button></div><button id="toolToggle">Tools <span>⌃</span></button><button id="helpButton" class="quiet">How to work</button></section>
<section id="toolTray" class="tool-tray" aria-label="Tool and parts tray"></section>
</main><div id="toast" role="status" aria-live="polite"></div><dialog id="drawer"><button id="closeDrawer" aria-label="Close drawer" class="close">×</button><div id="drawerContent"></div></dialog><script type="module" src="/ui.js"></script></body></html>
